<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timechime Configurator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 2rem;
      max-width: 720px;
      margin: 0 auto;
    }

    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1.1rem; margin-bottom: 0.75rem; color: #444; }

    section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .row + .row { margin-top: 0.5rem; }

    label { font-size: 0.9rem; min-width: 5rem; }

    input[type="number"] {
      width: 5rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    select {
      min-width: 10rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      background: #fff;
    }

    button {
      padding: 0.4rem 0.9rem;
      border: none;
      border-radius: 4px;
      background: #0078d4;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:disabled { background: #aaa; cursor: not-allowed; }
    button.danger { background: #c0392b; }
    button.secondary { background: #555; }

    #connect-btn { font-size: 1rem; padding: 0.5rem 1.2rem; margin-bottom: 1.5rem; }

    #status {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 1.5rem;
    }
    #status.connected { color: #27ae60; }
    #status.error { color: #c0392b; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      margin-top: 0.5rem;
    }
    th, td {
      text-align: left;
      padding: 0.4rem 0.6rem;
      border-bottom: 1px solid #eee;
    }
    th { background: #f9f9f9; font-weight: 600; }
    td:last-child { text-align: right; }

    .alarm-delete { background: #c0392b; padding: 0.2rem 0.6rem; font-size: 0.8rem; }
    .empty-row td { color: #aaa; text-align: center; }

    #tz-display { font-size: 0.88rem; color: #555; margin-top: 0.4rem; min-height: 1.2em; }

    input[type="file"] { font-size: 0.85rem; }
    #upload-progress { width: 100%; margin-top: 0.75rem; }
    #upload-status { font-size: 0.85rem; color: #555; margin-top: 0.4rem; min-height: 1.2em; }
    #upload-status.error { color: #c0392b; }
    #upload-status.ok { color: #27ae60; }
    .hint { font-size: 0.8rem; color: #888; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>Timechime</h1>

  <button id="connect-btn">Connect via WebUSB</button>
  <div id="status">Not connected</div>

  <!-- Timezone -->
  <section id="tz-section">
    <h2>Timezone</h2>
    <div id="tz-display">—</div>
    <div class="row" style="margin-top:0.75rem">
      <label>Hours</label>
      <input type="number" id="tz-hours" min="-12" max="14" value="0">
    </div>
    <div class="row">
      <label>Minutes</label>
      <input type="number" id="tz-minutes" min="-59" max="59" value="0">
    </div>
    <div class="row" style="margin-top:0.75rem; gap:0.5rem">
      <button id="tz-get-btn" disabled>Refresh</button>
      <button id="tz-set-btn" disabled>Set Timezone</button>
    </div>
  </section>

  <!-- Alarms -->
  <section id="alarm-section">
    <h2>Alarms</h2>
    <table id="alarm-table">
      <thead>
        <tr>
          <th>#</th><th>Time</th><th>Sound</th><th>Enabled</th><th></th>
        </tr>
      </thead>
      <tbody id="alarm-tbody">
        <tr class="empty-row"><td colspan="5">No alarms loaded</td></tr>
      </tbody>
    </table>

    <div style="margin-top:1rem">
      <h2 style="margin-bottom:0.5rem">Add Alarm</h2>
      <div class="row">
        <label>Hour (0–23)</label>
        <input type="number" id="alarm-hour" min="0" max="23" value="7">
      </div>
      <div class="row">
        <label>Minute</label>
        <input type="number" id="alarm-minute" min="0" max="59" value="0">
      </div>
      <div class="row">
        <label>Sound</label>
        <select id="alarm-sound"></select>
      </div>
      <div class="row">
        <label>Enabled</label>
        <input type="checkbox" id="alarm-enabled" checked>
      </div>
      <div class="row" style="margin-top:0.75rem; gap:0.5rem">
        <button id="alarm-get-btn" disabled>Refresh Alarms</button>
        <button id="alarm-add-btn" disabled>Add Alarm</button>
      </div>
    </div>
  </section>

  <!-- Sound upload -->
  <section id="sound-section">
    <h2>Upload Sound</h2>
    <div class="row">
      <input type="file" id="sound-file"
             accept=".mp3,.aac,.m4a,.mp4,.ogg,.oga,.wma,.mid,.midi,.flac,.wav,audio/*">
    </div>
    <div class="row" style="margin-top:0.75rem">
      <button id="sound-upload-btn" disabled>Upload</button>
    </div>
    <progress id="upload-progress" value="0" max="1" hidden></progress>
    <div id="upload-status"></div>
    <div class="hint">
      MP3, AAC, Ogg Vorbis, WMA, MIDI, FLAC or WAV. File base name max 8 characters.
    </div>
  </section>

  <script>
  'use strict';

  /* ---- Protocol constants ---- */
  const CMD = {
    GET_TIMEZONE: 0x01, SET_TIMEZONE: 0x02, GET_ALARMS: 0x03, ADD_ALARM: 0x04, DELETE_ALARM: 0x05,
    SOUND_UPLOAD_BEGIN: 0x06, SOUND_UPLOAD_DATA: 0x07, SOUND_UPLOAD_END: 0x08,
    SOUND_UPLOAD_ABORT: 0x09, GET_SOUND: 0x0A,
  };
  const RESP = {
    TIMEZONE: 0x01, ALARMS: 0x03, SOUND_ADDED: 0x06, SOUND: 0x0A, ACK: 0xFF, NAK: 0xFE,
  };

  const VID = 0x1e2a;
  const PID = 0x000A;

  const SOUND_BASE_MAX_LEN = 8;
  // Shorten 4 char extensions to 3 for FAT16 support.
  const SOUND_EXTENSIONS = {
    mp3: 'mp3', aac: 'aac', m4a: 'm4a', mp4: 'mp4', ogg: 'ogg', oga: 'oga',
    wma: 'wma', mid: 'mid', midi: 'mid', flac: 'fla', wav: 'wav',
  };
  const UPLOAD_CHUNK_MAX = 192;
  const UPLOAD_SIZE_MAX = 8 * 1024 * 1024;

  /* ---- UI elements ---- */
  const connectBtn  = document.getElementById('connect-btn');
  const statusEl    = document.getElementById('status');
  const tzDisplay   = document.getElementById('tz-display');
  const tzHoursIn   = document.getElementById('tz-hours');
  const tzMinutesIn = document.getElementById('tz-minutes');
  const tzGetBtn    = document.getElementById('tz-get-btn');
  const tzSetBtn    = document.getElementById('tz-set-btn');
  const alarmTbody  = document.getElementById('alarm-tbody');
  const alarmHour   = document.getElementById('alarm-hour');
  const alarmMin    = document.getElementById('alarm-minute');
  const alarmSound  = document.getElementById('alarm-sound');
  const alarmEnab   = document.getElementById('alarm-enabled');
  const alarmGetBtn = document.getElementById('alarm-get-btn');
  const alarmAddBtn = document.getElementById('alarm-add-btn');
  const soundFileIn = document.getElementById('sound-file');
  const soundUpBtn  = document.getElementById('sound-upload-btn');
  const uploadProg  = document.getElementById('upload-progress');
  const uploadStat  = document.getElementById('upload-status');

  /* ---- Device state ---- */
  let device = null;
  let epOut = null;
  let epIn  = null;
  let uploading = false;
  let soundNames = [];

  function setConnected(connected) {
    [tzGetBtn, tzSetBtn, alarmGetBtn, alarmAddBtn, soundUpBtn].forEach(b => b.disabled = !connected);
    connectBtn.textContent = connected ? 'Disconnect' : 'Connect via WebUSB';
    statusEl.textContent   = connected ? 'Connected' : 'Not connected';
    statusEl.className     = connected ? 'connected' : '';
  }

  function setStatus(msg, cls = '') {
    statusEl.textContent = msg;
    statusEl.className = cls;
  }

  /* ---- WebUSB connection ---- */
  async function connect() {
    try {
      device = await navigator.usb.requestDevice({ filters: [{ vendorId: VID, productId: PID }] });
      await device.open();
      if (device.configuration === null) {
        await device.selectConfiguration(1);
      }
      await device.claimInterface(0);

      const iface = device.configuration.interfaces[0].alternate;
      for (const ep of iface.endpoints) {
        if (ep.direction === 'out') epOut = ep.endpointNumber;
        if (ep.direction === 'in')  epIn  = ep.endpointNumber;
      }

      setConnected(true);
      getTimezone();
      await getSounds();
      getAlarms();
    } catch (e) {
      setStatus('Connection failed: ' + e.message, 'error');
      device = null;
    }
  }

  async function disconnect() {
    if (device) {
      await device.close();
      device = null;
      epOut = null;
      epIn  = null;
    }
    soundNames = [];
    renderSounds();
    setConnected(false);
  }

  /* ---- Serial send and receive ---- */
  async function send(bytes) {
    if (!device) throw new Error('Not connected');
    await device.transferOut(epOut, new Uint8Array(bytes));
  }

  async function recv() {
    const result = await device.transferIn(epIn, 256);
    return new Uint8Array(result.data.buffer);
  }

  async function sendRecv(bytes) {
    await send(bytes);
    return recv();
  }

  /* ---- Protocol helpers ---- */
  async function getTimezone() {
    try {
      const resp = await sendRecv([CMD.GET_TIMEZONE]);
      if (resp[0] !== RESP.TIMEZONE) throw new Error('Unexpected response');
      const hours   = new Int8Array([resp[1]])[0];
      const minutes = new Int8Array([resp[2]])[0];
      const sign = hours < 0 || (hours === 0 && minutes < 0) ? '-' : '+';
      const ah = Math.abs(hours);
      const am = Math.abs(minutes);
      tzDisplay.textContent = `UTC${sign}${String(ah).padStart(2,'0')}:${String(am).padStart(2,'0')}`;
      tzHoursIn.value   = hours;
      tzMinutesIn.value = minutes;
    } catch (e) {
      setStatus('Timezone read failed: ' + e.message, 'error');
    }
  }

  async function setTimezone() {
    const hours   = Math.max(-12, Math.min(14,  parseInt(tzHoursIn.value)   || 0));
    const minutes = Math.max(-59, Math.min(59,  parseInt(tzMinutesIn.value) || 0));
    const hByte   = new Uint8Array(new Int8Array([hours]).buffer)[0];
    const mByte   = new Uint8Array(new Int8Array([minutes]).buffer)[0];
    try {
      const resp = await sendRecv([CMD.SET_TIMEZONE, hByte, mByte]);
      if (resp[0] === RESP.ACK) {
        getTimezone();
      } else {
        setStatus('Set timezone failed (NAK)', 'error');
      }
    } catch (e) {
      setStatus('Set timezone failed: ' + e.message, 'error');
    }
  }

  async function getAlarms() {
    try {
      const resp = await sendRecv([CMD.GET_ALARMS]);
      if (resp[0] !== RESP.ALARMS) throw new Error('Unexpected response');
      const count = resp[1];
      const alarms = [];
      for (let i = 0; i < count; i++) {
        const base = 2 + i * 4;
        alarms.push({
          hour:    resp[base],
          minute:  resp[base + 1],
          soundId: resp[base + 2],
          enabled: resp[base + 3] !== 0,
        });
      }
      renderAlarms(alarms);
    } catch (e) {
      setStatus('Alarm read failed: ' + e.message, 'error');
    }
  }

  async function addAlarm() {
    const hour    = Math.max(0, Math.min(23,  parseInt(alarmHour.value)  || 0));
    const minute  = Math.max(0, Math.min(59,  parseInt(alarmMin.value)   || 0));
    const soundId = parseInt(alarmSound.value);
    const enabled = alarmEnab.checked ? 1 : 0;
    if (!Number.isInteger(soundId)) {
      setStatus('Upload a sound before adding an alarm', 'error');
      return;
    }
    try {
      const resp = await sendRecv([CMD.ADD_ALARM, hour, minute, soundId, enabled]);
      if (resp[0] === RESP.ACK) {
        getAlarms();
      } else {
        setStatus('Add alarm failed (NAK)', 'error');
      }
    } catch (e) {
      setStatus('Add alarm failed: ' + e.message, 'error');
    }
  }

  async function deleteAlarm(index) {
    try {
      const resp = await sendRecv([CMD.DELETE_ALARM, index]);
      if (resp[0] === RESP.ACK) {
        getAlarms();
      } else {
        setStatus('Delete alarm failed (NAK)', 'error');
      }
    } catch (e) {
      setStatus('Delete alarm failed: ' + e.message, 'error');
    }
  }

  /* ---- Sounds ---- */
  async function getSounds() {
    try {
      const names = [];
      const decoder = new TextDecoder();
      let count = 1;
      for (let i = 0; i < count; i++) {
        const resp = await sendRecv([CMD.GET_SOUND, i]);
        if (resp[0] !== RESP.SOUND) throw new Error('Unexpected response');
        count = resp[1];
        if (i >= count) break;
        names.push(decoder.decode(resp.subarray(3, 3 + resp[2])) || `Sound ${i}`);
      }
      soundNames = names;
    } catch (e) {
      soundNames = [];
      setStatus('Sound list read failed: ' + e.message, 'error');
    }
    renderSounds();
  }

  /* ---- Sound upload ---- */
  function sanitizeSoundName(fileName) {
    const dot = fileName.lastIndexOf('.');
    if (dot <= 0) return null;

    const ext = SOUND_EXTENSIONS[fileName.slice(dot + 1).toLowerCase()];
    if (!ext) return null;

    let base = fileName.slice(0, dot).replace(/[^A-Za-z0-9_-]/g, '_').replace(/^[_-]+/, '');
    if (base === '') base = 'sound';

    return base.slice(0, SOUND_BASE_MAX_LEN) + '.' + ext;
  }

  function setUploadStatus(msg, cls = '') {
    uploadStat.textContent = msg;
    uploadStat.className = cls;
  }

  async function uploadSound() {
    if (uploading) return;

    const file = soundFileIn.files[0];
    if (!file) {
      setUploadStatus('Select an audio file.', 'error');
      return;
    }
    if (file.size === 0) {
      setUploadStatus('File is empty.', 'error');
      return;
    }
    if (file.size > UPLOAD_SIZE_MAX) {
      setUploadStatus('File too large.', 'error');
      return;
    }

    const name = sanitizeSoundName(file.name);
    if (!name) {
      setUploadStatus('Unsupported file type.', 'error');
      return;
    }

    uploading = true;
    soundUpBtn.disabled = true;
    uploadProg.hidden = false;
    uploadProg.value = 0;
    uploadProg.max = file.size;
    setUploadStatus(`Uploading as "${name}"...`);

    try {
      const nameBytes = new TextEncoder().encode(name);
      let resp = await sendRecv([CMD.SOUND_UPLOAD_BEGIN, nameBytes.length, ...nameBytes]);
      if (resp[0] !== RESP.ACK) throw new Error('File name rejected');

      const bytes = new Uint8Array(await file.arrayBuffer());
      for (let offset = 0; offset < bytes.length; ) {
        let size = Math.min(UPLOAD_CHUNK_MAX, bytes.length - offset);
        // Keep the transfer from ending on a full 64-byte packet so the device sees its end.
        if ((size + 2) % 64 === 0) size -= 1;

        const chunk = bytes.subarray(offset, offset + size);
        resp = await sendRecv([CMD.SOUND_UPLOAD_DATA, size, ...chunk]);
        if (resp[0] !== RESP.ACK) throw new Error(`Failed at byte ${offset}`);

        offset += size;
        uploadProg.value = offset;
      }

      resp = await sendRecv([CMD.SOUND_UPLOAD_END]);
      if (resp[0] !== RESP.SOUND_ADDED) throw new Error('Failed to save sound');

      const soundId = resp[1];
      await getSounds();
      alarmSound.value = soundId;
      setUploadStatus(`Saved "${name}" with ID ${soundId}.`, 'ok');
    } catch (e) {
      setUploadStatus('Upload failed: ' + e.message, 'error');
      try {
        await sendRecv([CMD.SOUND_UPLOAD_ABORT]);
      } catch (_) {}
    } finally {
      uploading = false;
      soundUpBtn.disabled = !device;
      uploadProg.hidden = true;
    }
  }

  /* ---- Rendering ---- */
  function renderSounds() {
    const previous = alarmSound.value;

    alarmSound.innerHTML = '';
    if (soundNames.length === 0) {
      const opt = document.createElement('option');
      opt.textContent = 'No sounds uploaded';
      opt.value = '';
      alarmSound.appendChild(opt);
      alarmSound.disabled = true;
      return;
    }

    soundNames.forEach((name, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = name;
      alarmSound.appendChild(opt);
    });
    alarmSound.disabled = false;
    alarmSound.value = previous !== '' && Number(previous) < soundNames.length ? previous : 0;
  }

  function renderAlarms(alarms) {
    alarmTbody.innerHTML = '';
    if (alarms.length === 0) {
      alarmTbody.innerHTML = '<tr class="empty-row"><td colspan="5">No alarms</td></tr>';
      return;
    }
    alarms.forEach((a, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${i + 1}</td>
        <td>${String(a.hour).padStart(2,'0')}:${String(a.minute).padStart(2,'0')}</td>
        <td></td>
        <td>${a.enabled ? 'Yes' : 'No'}</td>
        <td><button class="alarm-delete">Delete</button></td>`;
      tr.children[2].textContent = soundNames[a.soundId] ?? `Sound ${a.soundId}`;
      tr.querySelector('.alarm-delete').onclick = () => deleteAlarm(i);
      alarmTbody.appendChild(tr);
    });
  }

  /* ---- Event listeners ---- */
  connectBtn.addEventListener('click', () => device ? disconnect() : connect());
  tzGetBtn.addEventListener('click', getTimezone);
  tzSetBtn.addEventListener('click', setTimezone);
  alarmGetBtn.addEventListener('click', getAlarms);
  alarmAddBtn.addEventListener('click', addAlarm);
  soundUpBtn.addEventListener('click', uploadSound);

  renderSounds();

  navigator.usb.addEventListener('disconnect', e => {
    if (device && e.device === device) {
      device = null;
      soundNames = [];
      renderSounds();
      setConnected(false);
      setStatus('Device disconnected', 'error');
    }
  });
  </script>
</body>
</html>
